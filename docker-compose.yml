services:
  cobro:
    build: ./cobro
    container_name: farmacia_cobro
    ports:
      - "8001:8000"
    environment:
      - DB_PATH=/data/cobro.db
    volumes:
      - cobro_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  arqueo:
    build: ./arqueo
    container_name: farmacia_arqueo
    ports:
      - "8002:8000"
    environment:
      - DB_PATH=/data/arqueo.db
    volumes:
      - arqueo_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  ventas:
    build: ./ventas
    container_name: farmacia_ventas
    ports:
      - "8000:8000"
    environment:
      - DB_PATH=/data/ventas.db
      - COBRO_URL=http://cobro:8000
      - ARQUEO_URL=http://arqueo:8000
    volumes:
      - ventas_data:/data
    depends_on:
      cobro:
        condition: service_healthy
      arqueo:
        condition: service_healthy

volumes:
  ventas_data:
  cobro_data:
  arqueo_data:
